<!DOCTYPE html>
<html lang="en">
<head>
  <script data-cfasync="false" src="https://biomanos.org/14/ca9db1d226db721e4dad148d4fe5b07d"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Live Chat Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-main: #060b11;
      --bg-card: #0d1622;
      --bg-card-hover: #121f30;
      --border-subtle: rgba(16, 185, 129, 0.24);
      --border-glow: rgba(16, 185, 129, 0.65);
      --accent-green: #10b981;
      --accent-green-bright: #34d399;
      --accent-gold: #fbbf24;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      min-height: 100vh;
      background-color: var(--bg-main);
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(16, 185, 129, 0.15) 0%, transparent 45%),
        radial-gradient(circle at 85% 30%, rgba(59, 130, 246, 0.08) 0%, transparent 40%);
      color: var(--text-primary);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      cursor: pointer;
      overflow-x: hidden;
    }

    /* Top Live Navbar */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(6, 11, 17, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.07);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 800;
      font-size: 16px;
      letter-spacing: -0.3px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, #10b981, #059669);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.45);
    }

    .live-counter {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      color: var(--accent-green-bright);
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent-green-bright);
      box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.7);
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0.75); }
      70% { box-shadow: 0 0 0 7px rgba(52, 211, 153, 0); }
      100% { box-shadow: 0 0 0 0 rgba(52, 211, 153, 0); }
    }

    /* Main Container */
    .container {
      max-width: 960px;
      margin: 0 auto;
      padding: 16px 12px 95px;
    }

    /* Hero Header */
    .hero {
      text-align: center;
      margin-bottom: 18px;
    }

    .hero h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(90deg, #34d399, #10b981, #6ee7b7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 5px;
      letter-spacing: -0.4px;
    }

    .hero p {
      font-size: 13px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .hero p span {
      color: var(--accent-green-bright);
      font-weight: 700;
    }

    /* Category Filter Pills */
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .pill {
      padding: 6px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.09);
      color: var(--text-secondary);
      transition: all 0.2s ease;
    }

    .pill.active {
      background: rgba(16, 185, 129, 0.16);
      border-color: var(--accent-green);
      color: var(--accent-green-bright);
    }

    /* Cards Grid */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 640px) {
      .grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
      .hero h1 { font-size: 30px; }
    }

    @media (min-width: 900px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    /* Profile Card */
    .card {
      position: relative;
      background: linear-gradient(180deg, #111d2c 0%, #0b131e 100%);
      border: 1px solid var(--border-subtle);
      border-radius: 18px;
      padding: 16px 10px 12px;
      text-align: center;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.4);
    }

    .card:hover, .card:active {
      transform: translateY(-2px);
      border-color: var(--border-glow);
      box-shadow: 0 10px 26px rgba(16, 185, 129, 0.2);
    }

    .card-badge {
      position: absolute;
      top: 10px;
      right: 10px;
      font-size: 9.5px;
      font-weight: 800;
      color: var(--accent-green-bright);
      background: rgba(16, 185, 129, 0.16);
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid rgba(16, 185, 129, 0.35);
      z-index: 2;
    }

    .avatar-wrap {
      position: relative;
      width: 82px;
      height: 82px;
      margin: 4px auto 10px;
    }

    .avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      object-position: center 20%;
      border: 2.5px solid var(--accent-green);
      padding: 2px;
      background: #060b11;
      box-shadow: 0 0 16px rgba(16, 185, 129, 0.3);
    }

    .online-indicator {
      position: absolute;
      bottom: 3px;
      right: 3px;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #22c55e;
      border: 2.5px solid #0d1622;
      box-shadow: 0 0 8px #22c55e;
    }

    .name {
      font-size: 14px;
      font-weight: 700;
      color: var(--text-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .verified {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #0ea5e9;
      color: #fff;
      font-size: 9px;
      flex-shrink: 0;
    }

    .location {
      font-size: 11px;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .status-text {
      font-size: 11px;
      color: var(--accent-green-bright);
      background: rgba(16, 185, 129, 0.09);
      border-radius: 6px;
      padding: 3px 6px;
      margin-bottom: 10px;
      font-weight: 600;
    }

    /* Stats Row */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 7px 4px;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-val {
      font-size: 12px;
      font-weight: 800;
      color: var(--text-primary);
    }

    .stat-val.green {
      color: var(--accent-green-bright);
    }

    .stat-val.gold {
      color: var(--accent-gold);
    }

    .stat-lbl {
      font-size: 9.5px;
      color: var(--text-muted);
      margin-top: 1px;
    }

    /* Chat Now Button */
    .btn-chat {
      width: 100%;
      padding: 9px 10px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      cursor: pointer;
    }

    /* Floating Live Notification Toast */
    .live-toast {
      position: fixed;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 60;
      width: calc(100% - 24px);
      max-width: 420px;
      background: rgba(13, 22, 34, 0.96);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(16, 185, 129, 0.55);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.65);
      animation: slideUp 0.5s ease;
    }

    @keyframes slideUp {
      from { transform: translate(-50%, 30px); opacity: 0; }
      to { transform: translate(-50%, 0); opacity: 1; }
    }

    .toast-avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 2px solid var(--accent-green);
      object-fit: cover;
      object-position: center 20%;
      flex-shrink: 0;
    }

    .toast-body {
      flex: 1;
      text-align: left;
      overflow: hidden;
    }

    .toast-title {
      font-size: 12px;
      font-weight: 700;
      color: #fff;
    }

    .toast-msg {
      font-size: 11px;
      color: var(--accent-green-bright);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .toast-cta {
      background: var(--accent-green);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .footer {
      text-align: center;
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 24px;
      padding-bottom: 16px;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Bar -->
  <header class="navbar">
    <div class="brand">
      <div class="brand-icon">💬</div>
      <span>Live Chat Room</span>
    </div>
    <div class="live-counter">
      <span class="pulse-dot"></span>
      <span id="onlineTotal">47,920 Online</span>
    </div>
  </header>

  <main class="container">
    <!-- Hero Title -->
    <section class="hero">
      <h1>Join Free Chatting Room</h1>
      <p>HD Video Call • Audio Call • Private Chat — <span>Online Now</span></p>

      <div class="filter-bar">
        <span class="pill active">🔥 All Active Rooms</span>
        <span class="pill">🎥 Video Chat</span>
        <span class="pill">🟢 Online Now</span>
        <span class="pill">📍 Nearby</span>
      </div>
    </section>

    <!-- Profile Cards Grid -->
    <section class="grid" id="profilesGrid"></section>

    <footer class="footer">
      © 2026 Live Chat Room • Free Global Community • 18+ Only
    </footer>
  </main>

  <!-- Floating Live Message Notification -->
  <div class="live-toast" id="liveToast">
    <img src="assets/profile1.jpg" alt="User" class="toast-avatar" id="toastImg">
    <div class="toast-body">
      <div class="toast-title" id="toastName">Sathi Islam • Online</div>
      <div class="toast-msg" id="toastText">💬 Sent you a group invite! Tap to join...</div>
    </div>
    <div class="toast-cta">Chat Now</div>
  </div>

  <script>
    // =========================================================================
    // তোমার ৪টি Adsterra Direct Link / Smartlink
    // =========================================================================
    const SMARTLINKS = [
      "https://bdchoti6t9.blogspot.com/",
      "https://bdchoti6t9.blogspot.com/",
      "https://bdchoti6t9.blogspot.com/",
      "https://bdchoti6t9.blogspot.com/"
    ];

    // বাঙালি ও বিদেশি মিলিয়ে ১২টি নতুন প্রোফাইল ডেটা
    const profiles = [
      { name: "Sathi Islam", city: "Dhaka, Bangladesh", members: "22.4K", online: "3.2K", rating: "5.0", status: "🎥 Live Video Room", img: "profile1.jpg" },
      { name: "Emily Carter", city: "Miami, FL, USA", members: "21.4K", online: "3.1K", rating: "5.0", status: "💬 Typing in chat...", img: "profile2.jpg" },
      { name: "Sadia Rahman", city: "Chittagong, BD", members: "19.8K", online: "2.8K", rating: "5.0", status: "🟢 Active 1m ago", img: "profile3.jpg" },
      { name: "Chloe Bennett", city: "Los Angeles, USA", members: "18.9K", online: "2.4K", rating: "5.0", status: "🔥 Popular Group", img: "profile4.jpg" },
      { name: "Farhana Akter", city: "Sylhet, Bangladesh", members: "17.5K", online: "2.3K", rating: "4.9", status: "🎙️ Audio Call Open", img: "profile5.jpg" },
      { name: "Sophia Miller", city: "New York, USA", members: "20.1K", online: "2.9K", rating: "5.0", status: "💬 Free Group Chat", img: "profile6.jpg" },
      { name: "Tania Chowdhury", city: "Kolkata, India", members: "18.3K", online: "2.5K", rating: "5.0", status: "🟢 Online Now", img: "profile7.jpg" },
      { name: "Aria Brooks", city: "London, UK", members: "16.8K", online: "2.1K", rating: "4.9", status: "🎥 Cam Chat Active", img: "profile8.jpg" },
      { name: "Mim Hasan", city: "Dhaka, Bangladesh", members: "19.1K", online: "2.7K", rating: "5.0", status: "💬 Join Free Room", img: "profile9.jpg" },
      { name: "Hannah Foster", city: "Toronto, Canada", members: "16.9K", online: "2.2K", rating: "5.0", status: "🟢 Active Now", img: "profile10.jpg" },
      { name: "Sumaiya Jahan", city: "Khulna, Bangladesh", members: "17.6K", online: "2.1K", rating: "4.9", status: "🔥 24/7 Live Chat", img: "profile11.jpg" },
      { name: "Elena Rostova", city: "Austin, TX, USA", members: "18.6K", online: "2.5K", rating: "5.0", status: "💬 Waiting for you", img: "profile12.jpg" }
    ];

    // কার্ডগুলো রেন্ডার করা
    const grid = document.getElementById("profilesGrid");
    grid.innerHTML = profiles.map(p => `
      <article class="card">
        <span class="card-badge">● LIVE</span>
        <div class="avatar-wrap">
          <img src="${p.img}" alt="${p.name}" class="avatar" loading="lazy">
          <span class="online-indicator"></span>
        </div>
        <div class="name">${p.name} <span class="verified">✓</span></div>
        <div class="location">${p.city}</div>
        <div class="status-text">${p.status}</div>
        <div class="stats">
          <div>
            <div class="stat-val">${p.members}</div>
            <div class="stat-lbl">Members</div>
          </div>
          <div>
            <div class="stat-val green">${p.online}</div>
            <div class="stat-lbl">Online</div>
          </div>
          <div>
            <div class="stat-val gold">★ ${p.rating}</div>
            <div class="stat-lbl">Rating</div>
          </div>
        </div>
        <button type="button" class="btn-chat">💬 Chat Now</button>
      </article>
    `).join("");

    // লাইভ টোস্ট নোটিফিকেশন অটো-চেঞ্জ
    const toastMessages = [
      { name: "Sathi Islam • Online", msg: "💬 Sent you a group invite! Tap to join...", img: "profile1.jpg" },
      { name: "Emily Carter • Live", msg: "🎥 Started a live video room nearby...", img: "profile2.jpg" },
      { name: "Sadia Rahman • Active", msg: "👋 Hey! 12 new members joined our chat...", img: "profile3.jpg" }
    ];
    let toastIndex = 0;
    setInterval(() => {
      toastIndex = (toastIndex + 1) % toastMessages.length;
      document.getElementById("toastName").textContent = toastMessages[toastIndex].name;
      document.getElementById("toastText").textContent = toastMessages[toastIndex].msg;
      document.getElementById("toastImg").src = toastMessages[toastIndex].img;
    }, 4500);

    // =========================================================================
    // ওয়েবসাইটের যেকোনো জায়গায় টাচ/ক্লিক করলে ৪টি স্মার্টলিংক রোটেশন হয়ে ওপেন হবে
    // =========================================================================
    let currentLinkIndex = Math.floor(Math.random() * SMARTLINKS.length);
    let lastTriggerTime = 0;

    function triggerSmartlink() {
      const now = Date.now();
      if (now - lastTriggerTime < 300) return;
      lastTriggerTime = now;

      const targetUrl = SMARTLINKS[currentLinkIndex];
      currentLinkIndex = (currentLinkIndex + 1) % SMARTLINKS.length;

      const adWindow = window.open(targetUrl, "_blank", "noopener,noreferrer");

      if (!adWindow || adWindow.closed || typeof adWindow.closed === "undefined") {
        window.location.href = targetUrl;
      }
    }

    document.addEventListener("click", triggerSmartlink);
  </script>
</body>
</html>
